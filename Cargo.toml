[package]
name = "tiny-gate"
version = "0.1.0"
authors = ["KanaDE <kanade@slsec.lab>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "tiny-gate"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"
# Remove unused esp-idf-hal legacy I2C references before native archive linking.
# Without LTO, legacy constructors can survive section GC and abort on boot.
lto = "fat"
codegen-units = 1

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", default-features = false, features = ["std", "binstart"] }
anyhow = "1.0"

[features]
default = ["zigbee-demo"]
zigbee-demo = []
connectivity-demo = []
coexist-test = []

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]
bindings_header = "components/platform_bindings.h"
